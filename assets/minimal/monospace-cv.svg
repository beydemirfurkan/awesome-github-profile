<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Monospace CV — a profile rendered as a terminal session">
  <title>Monospace CV</title>
  <defs>
    <linearGradient id="mc-bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#080b10"/>
    </linearGradient>
    <linearGradient id="mc-chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2230"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <!-- The window sits on a faint pool of its own light. Cheap depth: one
         blurred ellipse, no drop-shadow filter on the window itself. -->
    <radialGradient id="mc-pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2d6cff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#2d6cff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="mc-clip"><rect x="40" y="30" width="1120" height="360" rx="12"/></clipPath>
  </defs>

  <rect width="1200" height="420" fill="url(#mc-bg)"/>
  <ellipse cx="600" cy="392" rx="520" ry="90" fill="url(#mc-pool)"/>

  <!-- Window -->
  <rect x="40" y="30" width="1120" height="360" rx="12" fill="#0d1117" stroke="#232b39" stroke-width="1"/>
  <g clip-path="url(#mc-clip)">
    <rect x="40" y="30" width="1120" height="40" fill="url(#mc-chrome)"/>
  </g>
  <line x1="40" y1="70" x2="1160" y2="70" stroke="#232b39" stroke-width="1"/>
  <circle cx="66" cy="50" r="5.5" fill="#ff5f57"/>
  <circle cx="86" cy="50" r="5.5" fill="#febc2e"/>
  <circle cx="106" cy="50" r="5.5" fill="#28c840"/>
  <text x="600" y="54" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#6e7681" letter-spacing="0.5">jane.doe — ~/profile — zsh</text>

  <!-- Session -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15">
    <text x="72" y="112"><tspan fill="#7ee787">jane@dev</tspan><tspan fill="#58a6ff"> ~ </tspan><tspan fill="#c9d1d9">$ whoami</tspan></text>
    <text x="72" y="140" fill="#9aa4b0">jane.doe — frontend.eng · istanbul, tr</text>

    <text x="72" y="180"><tspan fill="#7ee787">jane@dev</tspan><tspan fill="#58a6ff"> ~ </tspan><tspan fill="#c9d1d9">$ cat skills.txt</tspan></text>
    <text x="72" y="208" fill="#9aa4b0">typescript · react · node · figma · css</text>

    <text x="72" y="248"><tspan fill="#7ee787">jane@dev</tspan><tspan fill="#58a6ff"> ~ </tspan><tspan fill="#c9d1d9">$ uptime</tspan></text>
    <text x="72" y="276" fill="#9aa4b0">up 8 yrs, shipping production interfaces</text>

    <text x="72" y="316"><tspan fill="#7ee787">jane@dev</tspan><tspan fill="#58a6ff"> ~ </tspan><tspan fill="#c9d1d9">$ contact --all</tspan></text>
    <text x="72" y="344"><tspan fill="#58a6ff">→ jane.dev</tspan><tspan fill="#484f58">   ·   </tspan><tspan fill="#58a6ff">@janedoe</tspan><tspan fill="#484f58">   ·   </tspan><tspan fill="#58a6ff">in/janedoe</tspan></text>

    <text x="72" y="376"><tspan fill="#7ee787">jane@dev</tspan><tspan fill="#58a6ff"> ~ </tspan><tspan fill="#c9d1d9">$ </tspan></text>
  </g>
  <rect x="185" y="365" width="9" height="16" fill="#c9d1d9">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

</svg>
